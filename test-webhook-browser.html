<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Test - Browser Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .section {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .code-block {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin: 10px 0;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 10px 10px 0;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .success {
            color: #10b981;
            font-weight: bold;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
        }

        .info {
            background: #e0e7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info strong {
            color: #667eea;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Webhook Signature Test (Browser)</h1>

        <div class="info">
            <strong>⚠️ IMPORTANT:</strong> The signature MUST be generated from the EXACT string that is sent in the request body. 
            Any difference in whitespace, newlines, or formatting will cause validation to fail.
        </div>

        <div class="section">
            <h3>📝 Payload (Edit if needed)</h3>
            <textarea id="payloadInput"></textarea>
            <button onclick="loadDefaultPayload()">Load Default Payload</button>
        </div>

        <div class="section">
            <button onclick="generateAndSend()" id="sendBtn">🚀 Generate Signature & Send Request</button>
            <button onclick="justGenerateSignature()">🔑 Just Generate Signature</button>
        </div>

        <div class="section" id="resultSection" style="display: none;">
            <h3>📊 Results</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const SIGNING_KEY = 'test-signing-key-456';
        const ENDPOINT = 'http://localhost:3000/callback/payment';

        function loadDefaultPayload() {
            const timestamp = Date.now();
            const payload = {
                "webhook_message_id": `evt_${timestamp}_test`,
                "api_version": 1,
                "event_type": "card_payment_succeeded",
                "created_date": new Date().toISOString(),
                "resource_id": `pay_${timestamp}_test`,
                "resource_type": "payment",
                "resource": {
                    "payment_id": `pay_${timestamp}_test`,
                    "payment_provider": "worldpay",
                    "amount": 2500,
                    "reference": "TEST-REF-001",
                    "description": "Browser test payment",
                    "state": {
                        "status": "success",
                        "finished": true
                    },
                    "return_url": "https://example.com/return",
                    "created_date": new Date().toISOString()
                }
            };
            
            // CRITICAL: Use consistent JSON formatting
            document.getElementById('payloadInput').value = JSON.stringify(payload, null, 2);
        }

        async function generateSignature(payloadString) {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(SIGNING_KEY);
            const messageData = encoder.encode(payloadString);
            
            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                keyData,
                { name: 'HMAC', hash: 'SHA-256' },
                false,
                ['sign']
            );
            
            const signature = await crypto.subtle.sign(
                'HMAC',
                cryptoKey,
                messageData
            );
            
            const hashArray = Array.from(new Uint8Array(signature));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return hashHex;
        }

        async function justGenerateSignature() {
            const payloadText = document.getElementById('payloadInput').value.trim();
            
            if (!payloadText) {
                alert('Please enter or load a payload first!');
                return;
            }

            try {
                // Parse to validate JSON
                const payload = JSON.parse(payloadText);
                
                // Re-stringify WITHOUT formatting (this is what gets sent)
                const payloadString = JSON.stringify(payload);
                
                const signature = await generateSignature(payloadString);
                
                const results = document.getElementById('results');
                results.innerHTML = `
                    <p><strong>✅ Signature Generated:</strong></p>
                    <div class="code-block">${signature}</div>
                    <p><strong>📝 Payload String (what was signed):</strong></p>
                    <div class="code-block">${escapeHtml(payloadString)}</div>
                    <p class="info">Copy the signature above and use it in your Pay-Signature header</p>
                `;
                document.getElementById('resultSection').style.display = 'block';
            } catch (error) {
                alert('Invalid JSON: ' + error.message);
            }
        }

        async function generateAndSend() {
            const payloadText = document.getElementById('payloadInput').value.trim();
            
            if (!payloadText) {
                alert('Please enter or load a payload first!');
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                // Parse to validate JSON
                const payload = JSON.parse(payloadText);
                
                // CRITICAL: Re-stringify WITHOUT formatting
                // This is the EXACT string that will be sent and must match what's signed
                const payloadString = JSON.stringify(payload);
                
                // Generate signature from the compact string
                const signature = await generateSignature(payloadString);
                
                console.log('Payload string:', payloadString);
                console.log('Signature:', signature);
                
                // Send request
                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Pay-Signature': signature,
                        'X-Webhook-Id': payload.webhook_message_id
                    },
                    body: payloadString  // Send the EXACT string we signed
                });
                
                const responseData = await response.text();
                let responseJson;
                try {
                    responseJson = JSON.parse(responseData);
                } catch {
                    responseJson = responseData;
                }
                
                const results = document.getElementById('results');
                
                if (response.status === 202) {
                    results.innerHTML = `
                        <p class="success">🎉 SUCCESS! Webhook accepted (202 Accepted)</p>
                        <p><strong>Generated Signature:</strong></p>
                        <div class="code-block">${signature}</div>
                        <p><strong>Response:</strong></p>
                        <div class="code-block">${escapeHtml(JSON.stringify(responseJson, null, 2))}</div>
                        <p><strong>Payload Sent (compact, no whitespace):</strong></p>
                        <div class="code-block">${escapeHtml(payloadString)}</div>
                    `;
                } else {
                    results.innerHTML = `
                        <p class="error">❌ FAILED! Status: ${response.status}</p>
                        <p><strong>Generated Signature:</strong></p>
                        <div class="code-block">${signature}</div>
                        <p><strong>Response:</strong></p>
                        <div class="code-block">${escapeHtml(JSON.stringify(responseJson, null, 2))}</div>
                        <p><strong>Payload Sent:</strong></p>
                        <div class="code-block">${escapeHtml(payloadString)}</div>
                        <div class="info">
                            <strong>💡 Troubleshooting:</strong><br>
                            1. Check Docker is running: <code>docker ps</code><br>
                            2. Verify signing key: <code>GOVPAY_WEBHOOK_SIGNING_KEY=test-signing-key-456</code><br>
                            3. Check endpoint: <code>${ENDPOINT}</code><br>
                            4. Open browser console (F12) for more details
                        </div>
                    `;
                }
                
                document.getElementById('resultSection').style.display = 'block';
                
            } catch (error) {
                const results = document.getElementById('results');
                results.innerHTML = `
                    <p class="error">❌ Error: ${escapeHtml(error.message)}</p>
                    <div class="info">
                        <strong>Common Issues:</strong><br>
                        • CORS error: Server must allow browser requests<br>
                        • Network error: Check if Docker containers are running<br>
                        • Invalid JSON: Check payload format
                    </div>
                `;
                document.getElementById('resultSection').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Generate Signature & Send Request';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load default payload on page load
        window.addEventListener('load', loadDefaultPayload);
    </script>
</body>
</html>
