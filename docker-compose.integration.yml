# Integration Testing Docker Compose
# Runs LocalStack (SQS), PostgreSQL, and both services for E2E testing
# 
# Usage:
#   docker-compose -f docker-compose.integration.yml up -d
#   docker-compose -f docker-compose.integration.yml down -v

version: '3.8'

services:
  # ===================================================
  # PostgreSQL Database
  # ===================================================
  postgres:
    image: postgres:15-alpine
    container_name: integration-postgres
    environment:
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: integration_pass
      POSTGRES_DB: integration_db
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_user -d integration_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - integration-net

  # ===================================================
  # LocalStack (SQS) - Using free community version
  # ===================================================
  localstack:
    image: localstack/localstack:3.5
    container_name: integration-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEBUG=0
      - EAGER_SERVICE_LOADING=1
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - integration-net

  # ===================================================
  # Inbound Event Receiver Service
  # ===================================================
  inbound-receiver:
    build:
      context: ./inbound-event-receiver
      dockerfile: Dockerfile
    container_name: integration-inbound-receiver
    ports:
      - "3000:3000"
    environment:
      # Server
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=debug
      
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=integration_db
      - DB_USER=integration_user
      - DB_PASSWORD=integration_pass
      - DB_POOL_MAX=10
      
      # AWS / LocalStack
      - AWS_REGION=eu-west-2
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PAYMENT_WEBHOOK_QUEUE_URL=http://localstack:4566/000000000000/payment-webhook-queue
      - SQS_ENABLED=true
      
      # Security
      - WEBHOOK_SECRET=test-webhook-secret-123
      - SIGNING_KEY=test-signing-key-456
      - GOVPAY_WEBHOOK_SIGNING_KEY=test-signing-key-456
      - GOVPAY_API_KEY=test_api_key_123
      - GOVPAY_API_URL=https://publicapi.payments.service.gov.uk
      - CORS_ORIGINS=*
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - integration-net

  # ===================================================
  # Payment Processor Webhook (Lambda simulator)
  # ===================================================
  payment-processor:
    build:
      context: ./DESNZ-SYEIA-Lambdas/payment-processor-webhook
      dockerfile: Dockerfile.integration
    container_name: integration-payment-processor
    environment:
      # Database
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=integration_db
      - PGUSER=integration_user
      - PGPASSWORD=integration_pass
      - PGSSLMODE=disable
      - DB_POOL_SIZE=5
      
      # AWS / LocalStack
      - AWS_REGION=eu-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - WEBHOOK_SQS_QUEUE_URL=http://localstack:4566/000000000000/payment-webhook-queue
      - ECS_CLUSTER_ARN=arn:aws:ecs:eu-west-2:000000000000:cluster/test-cluster
      - ECS_WEBHOOK_TASK_DEFINITION=test-task
      
      # Security
      - GOVUK_PAY_WEBHOOK_SECRET=test-webhook-secret-123
      
      # Testing
      - NODE_ENV=integration
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - integration-net

networks:
  integration-net:
    driver: bridge

volumes:
  postgres-data:
